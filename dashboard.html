<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceOCR Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">
    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-gray-800 text-white min-h-screen p-4">
        <h1 class="text-xl font-bold mb-6">Invoice OCR</h1>
        <nav class="space-y-2">
            <button onclick="showView('pipeline-dashboard')" class="block w-full text-left p-2 rounded hover:bg-gray-700">Pipeline Dashboard</button>
            <button onclick="showView('processing-logs')" class="block w-full text-left p-2 rounded hover:bg-gray-700">Processing Logs</button>
            <button onclick="showView('sql-tables')" class="block w-full text-left p-2 rounded hover:bg-gray-700">SQL Tables</button>
            <button onclick="showView('dead-letter-queue')" class="block w-full text-left p-2 rounded hover:bg-gray-700">Dead Letter Queue</button>
            <button onclick="showView('settings')" class="block w-full text-left p-2 rounded hover:bg-gray-700">Settings</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <div id="pipeline-dashboard" class="view">
            <h2 class="text-2xl font-bold mb-4">Pipeline Dashboard</h2>
            <div id="kpi-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- KPI Cards go here -->
            </div>
            <div class="bg-white p-4 rounded shadow mb-6">
                <canvas id="invoiceChart"></canvas>
            </div>
            <div id="invoice-list" class="bg-white p-4 rounded shadow">
                <!-- Invoice List Table -->
            </div>
        </div>

        <div id="processing-logs" class="view hidden">
            <h2 class="text-2xl font-bold mb-4">Processing Logs</h2>
            <p>Placeholder: Logs content</p>
        </div>

        <div id="sql-tables" class="view hidden">
            <h2 class="text-2xl font-bold mb-4">SQL Tables</h2>
            <p>Placeholder: SQL Tables content</p>
        </div>

        <div id="dead-letter-queue" class="view hidden">
            <h2 class="text-2xl font-bold mb-4">Dead Letter Queue</h2>
            <p>Placeholder: DLQ content</p>
        </div>

        <div id="settings" class="view hidden">
            <h2 class="text-2xl font-bold mb-4">Settings</h2>
            <p>Placeholder: Settings content</p>
        </div>
    </main>

    <script>
        let dashboardData = null;
        let currentPage = 1;
        const itemsPerPage = 10;

        async function fetchDashboardData() {
            const response = await fetch('dashboard_data.json');
            dashboardData = await response.json();
            renderDashboard();
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        function changePage(delta) {
            currentPage += delta;
            renderTable();
        }

        function renderTable() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedDocs = dashboardData.documents.slice(start, end);

            const invoiceList = document.getElementById('invoice-list');
            let tableHtml = `
                <table class="w-full text-left mb-4">
                    <thead><tr><th class="border-b p-2">Invoice #</th><th class="border-b p-2">Vendor</th><th class="border-b p-2">Total</th></tr></thead>
                    <tbody>
            `;
            paginatedDocs.forEach(doc => {
                tableHtml += `<tr><td class="border-b p-2">${doc.invoice_number}</td><td class="border-b p-2">${doc.vendor_name}</td><td class="border-b p-2">${doc.total_amount}</td></tr>`;
            });
            tableHtml += `</tbody></table>`;

            // Pagination controls
            tableHtml += `
                <div class="flex justify-between items-center">
                    <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''} class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Previous</button>
                    <span>Page ${currentPage} of ${Math.ceil(dashboardData.documents.length / itemsPerPage)}</span>
                    <button onclick="changePage(1)" ${end >= dashboardData.documents.length ? 'disabled' : ''} class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50">Next</button>
                </div>
            `;
            invoiceList.innerHTML = tableHtml;
        }

        function renderDashboard() {
            // Render KPI Cards
            const kpiContainer = document.getElementById('kpi-container');
            const totalInvoices = dashboardData.documents.length;
            kpiContainer.innerHTML = `
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="text-sm font-semibold text-gray-500">Total Invoices</h3>
                    <p class="text-2xl font-bold">${totalInvoices}</p>
                </div>
            `;

            renderTable();

            // Render Chart
            const ctx = document.getElementById('invoiceChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dashboardData.documents.map(d => d.invoice_number),
                    datasets: [{ label: 'Total Amount', data: dashboardData.documents.map(d => d.total_amount) }]
                }
            });
        }

        fetchDashboardData();
    </script>
</body>
</html>
